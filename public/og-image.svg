<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0f1e"/>

  <!-- Green accent bar left -->
  <rect x="0" y="0" width="6" height="630" fill="#2D6A4F"/>

  <!-- M logo icon background -->
  <rect x="90" y="225" width="100" height="100" rx="18" fill="#000000"/>

  <!-- M logo white stroke -->
  <path d="M 100,307 L 100,243 L 140,275 L 180,243 L 180,307"
        fill="none" stroke="white" stroke-width="27" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- M logo dashed overlay -->
  <path d="M 100,307 L 100,243 L 140,275 L 180,243 L 180,307"
        fill="none" stroke="black" stroke-width="5.5" stroke-dasharray="11 9" stroke-linecap="round"/>

  <!-- MINGISA text -->
  <text x="220" y="300" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="86" fill="white" letter-spacing="6">MINGISA</text>

  <!-- Divider line -->
  <rect x="220" y="320" width="480" height="2" fill="#2D6A4F" opacity="0.6"/>

  <!-- Tagline -->
  <text x="222" y="358" font-family="Arial, sans-serif" font-weight="400" font-size="26" fill="#9ca3af" letter-spacing="1">Safe Choice, Smooth Ride.</text>

  <!-- Bottom label -->
  <text x="222" y="430" font-family="Arial, sans-serif" font-weight="500" font-size="20" fill="#4ade80" opacity="0.7" letter-spacing="2">PREMIUM TAXI SERVICE IN KOREA</text>

  <!-- Contact channels -->
  <text x="222" y="470" font-family="Arial, sans-serif" font-size="18" fill="#6b7280" letter-spacing="1">LINE · WhatsApp · KakaoTalk · Instagram</text>

  <!-- URL -->
  <text x="1110" y="600" font-family="Arial, sans-serif" font-size="20" fill="#4b5563" text-anchor="end">mingisa.com</text>
</svg>
